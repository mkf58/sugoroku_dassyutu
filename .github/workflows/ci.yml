name: CI & Automated Tests

# 実行トリガー：devまたはmainへのpush、および手動実行
on:
  push:
    branches: [ dev, main ]
  workflow_dispatch:

jobs:
  unit-test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリのソースコードを取得
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Godot 4 (4.3.0) の実行バイナリをセットアップ
      - name: Setup Godot 4
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      # 3. プロジェクト初期化（クラスキャッシュ目録生成）と単体テスト実行
      - name: Run Godot Unit Tests
        run: |
          # クリーン環境で class_name をスキャン・認識させるためエディタ初期化を実行
          godot --headless --path 実装コード --editor --quit || true
          # 単体テストスイートの実行
          godot --headless --path 実装コード -s tests/test_runner.gd
